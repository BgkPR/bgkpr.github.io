<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Record</title>
  <script type="module" src="players.min.js"></script>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --bg: #0e1621;
      --panel: #151c26;
      --panel-light: #1c2633;
      --text: #edf4ff;
      --muted: #6f7e8fba;
      --accent: #0a1126;
      --accent-2: #ffca62;
      --danger: #ff7185;
      --border: #ffffff00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      --bg-image: url('wksr.png');
      --bg-filter: invert(1) brightness(2) drop-shadow(0 0 8px rgb(32, 7, 100));
      --bg-vw: 100vw;
      --bg-vh: 100vh;
      --width: 100%;
      --height: 1219px;
      color: var(--text);
      font-family: Inter, Segoe UI, sans-serif;
      background:
        linear-gradient(135deg, #0d1117 0%, #040609 100%) fixed;
    }

    summary {
      margin-top: 10px;
    }

    body::before {
      content: "";
      top: 0;
      right: 0;
      width: var(--width);
      position: fixed;
      height: var(--height);
      background-image: var(--bg-image);
      filter: var(--bg-filter);
      background-repeat: no-repeat;
      background-position: top;
      background-size: var(--bg-vw) var(--bg-vh);
      opacity: .05;
      pointer-events: none;
      z-index: 0;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem clamp(1rem, 5vw, 5rem);
      border-bottom: 0;
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 35%;
      width: 30%;
      border-bottom: 1px ridge var(--border);
    }

    .brand {
      color: var(--text);
      font-weight: 800;
      font-size: 2rem;
      text-transform: unset;
    }

    main {
      width: min(1100px, calc(100% - 2rem));
      margin: 2rem auto;
    }

    .profile-card {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      padding: 1.5rem;
      background: rgba(18, 22, 31, 0.126);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(3.1px);
      -webkit-backdrop-filter: blur(3.1px);
      border: 1px solid rgba(246, 246, 248, 0.042);
    }

    .profile-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 0.85px;
      background: linear-gradient(33deg, rgba(245, 245, 245, 0), rgba(255, 255, 255, 0.118) 75%, rgba(55, 102, 120, 0.252));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none; 
    }

    .profile-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 50px;
      border-radius: inherit;
      z-index: 1; 
      background: linear-gradient(
        to bottom, 
        rgba(255, 255, 255, 0.14) 0%, 
        rgba(255, 255, 255, 0.02) 40%, 
        transparent 100%
      );  
      pointer-events: none;
      border-top-right-radius: 16px;
    }

    .profile-card > * {
      position: relative;
      z-index: 2;
    }

    .avatar {
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 25%;
      overflow: hidden;
      color: #10201f;
      background: var(--accent);
      font-size: 2.5rem;
      font-weight: 900;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .previous-avatar {
      width: 75px;
      height: 75px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 5%;
      overflow: hidden;
      color: #10201f;
      background: var(--accent);
      font-size: 2.5rem;
      font-weight: 900;
    }

    .previous-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .skeleton {
      display: block;
      height: 1em;
      border-radius: 6px;
      background: linear-gradient(90deg, #ffffff0d 25%, #ffffff2b 50%, #ffffff0d 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }

    .skeleton-title { width: min(280px, 70vw); height: 1.15em; }
    .skeleton-id { width: 180px; }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    h1, h2, p { margin-top: 0; }

    h1 {
      margin-bottom: .4rem;
      font-size: clamp(1.8rem, 5vw, 3rem);
    }

    .user-id, .muted {
      color: var(--muted);
      word-break: break-word;
    }

    .grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    .alias-column {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .previous-profiles {
      margin-bottom: 1rem;
    }

    .previous-profile-list {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    .profile-avatar-item {
      display: flex;
      align-items: center;
      gap: .55rem;
      min-width: 0;
      padding: .45rem .6rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #ffffff08;
    }

    .profile-avatar-shimmer {
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .profile-name-shimmer {
      width: 85px;
      height: 1rem;
      border-radius: 999px;
    }

    section {
      padding: 1.25rem;
      background: rgba(31, 33, 50, 0.263);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.23);
      backdrop-filter: blur(6.1px);
      -webkit-backdrop-filter: blur(6.1px);
      border: 1px solid rgba(235, 235, 237, 0.054);
    }

    h2 {
      margin-bottom: 1rem;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .alias-item {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      padding: 1.5rem;
      background: rgb(0, 12, 39);
      border-radius: 16px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(3.1px);
      -webkit-backdrop-filter: blur(3.1px);
      border: 1px solid rgba(246, 246, 248, 0.042);
    }

    .alias-item::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 0.85px;
      background: linear-gradient(33deg, rgba(245, 245, 245, 0), rgba(255, 255, 255, 0.118) 75%, rgba(55, 102, 120, 0.252));
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .alias-list {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .alias-list li {
      padding: .45rem .7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--accent-2);
      background: #ffffff08;
    }

    .alias-list .shimmer-alias {
      width: 100px;
      height: 1.8rem;
      padding: 0;
    }

    .home-button {
      display: inline-block;
      margin-top: 1rem;
      align-self: flex-start;
      padding: .65rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--text);
      background: var(--bg);
      font-weight: 700;
      text-decoration: none;
    }

    .share-button {
      display: inline-block;
      margin-top: 1rem;
      align-self: flex-start;
      padding: .65rem 1rem;
      border: 1px solid #273e6e;
      border-radius: 8px;
      color: var(--text);
      background: #273e6e;
      font-weight: 700;
      text-decoration: none;
    }

    .share-button:hover,
    .share-button:focus-visible {
      background: #1d3e86;
    }

    .home-button:hover,
    .home-button:focus-visible {
      background: #111a2d;
    }

    .matches {
      display: grid;
      gap: .7rem;
    }

    .match {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      padding: 1rem;
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      background: var(--panel-light);
    }

    .match-shimmer {
      height: 4.25rem;
      border-left-color: var(--border);
    }

    details.match-chat {
      background-color: #f9f9f900;
    }

    details.match-chat[open] {
      background-color: #0b101b;
      display: flex;
      flex-direction: column;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .ul-chat{
      padding-top:15px;
      background-color: #070a12;
      display: flex;
      flex-direction: column;
      height: 100%;
      border-radius: 4px;
    }

    .match strong { display: block; margin-bottom: .25rem; }
    .match small { color: var(--muted); }
    small {color: var(--muted);}

    .win { color: var(--accent); }
    .loss { color: var(--danger); }

    .empty {
      padding: 1rem;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    @media (max-width: 700px) {
      .profile-card, .grid { grid-template-columns: 1fr; }
      .profile-card { display: block; text-align: center; }
      .avatar { margin: 0 auto 1rem; }
      .match { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    
    <article class="profile-card">
      <div id="avatar" class="avatar"><span class="skeleton" aria-label="Loading avatar"></span></div>
      <div>
        <h1 id="displayName"><span class="skeleton skeleton-title" aria-label="Loading player name"></span></h1>
        <a id="userId" class="user-id"><span class="skeleton skeleton-id" aria-label="Loading player ID"></span></a>
        <p class="muted"></p>
      </div>
    </article>

    <div class="grid">
      <div class="alias-column">
        <section id="discrim-tf-player">
          <div id="network-graph" style="width: 100%; height: 25vh; background: #111;"></div>
        </section>
        <section>
          <h2>Previous profiles</h2>
          <ul id="previousProfiles" class="alias-list previous-profile-list">
            <li class="profile-avatar-item" aria-label="Loading previous profile">
              <span class="skeleton profile-avatar-shimmer" aria-label="Loading previous profile avatar"></span>
              <span class="skeleton profile-name-shimmer" aria-label="Loading previous profile name"></span>
            </li>
            <li class="profile-avatar-item" aria-label="Loading previous profile">
              <span class="skeleton profile-avatar-shimmer" aria-label="Loading previous profile avatar"></span>
              <span class="skeleton profile-name-shimmer" aria-label="Loading previous profile name"></span>
            </li>
            <li class="profile-avatar-item" aria-label="Loading previous profile">
              <span class="skeleton profile-avatar-shimmer" aria-label="Loading previous profile avatar"></span>
              <span class="skeleton profile-name-shimmer" aria-label="Loading previous profile name"></span>
            </li>
          </ul>
        </section>
        <section>
          <h2>Known aliases</h2>
          <ul id="aliases" class="alias-list">
            <li class="skeleton shimmer-alias" aria-label="Loading alias"></li>
            <li class="skeleton shimmer-alias" aria-label="Loading alias"></li>
            <li class="skeleton shimmer-alias" aria-label="Loading alias"></li>
          </ul>
        </section>
        <button id="copy-share-btn" class="share-button" title="Copy short URL">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copy-tooltip">Copy TFRecords URL</span>
        </button>
        <a class="home-button" href="/tfrecords.html?">Return to homepage</a>
      </div>

      <section>
        <h2>Played matches</h2>
        <div id="matches" class="matches">
          <div class="skeleton match match-shimmer" aria-label="Loading match"></div>
          <div class="skeleton match match-shimmer" aria-label="Loading match"></div>
          <div class="skeleton match match-shimmer" aria-label="Loading match"></div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
